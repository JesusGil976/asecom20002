services:
  academy:
    build: .
    restart: unless-stopped
    stop_grace_period: 20s
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 3000
      DATA_DIR: /data
      DB_FILE: /data/academy.sqlite
      PUBLIC_UPLOAD_DIR: /uploads
      TRUST_PROXY: 1
      FFMPEG_PATH: ffmpeg
      FFPROBE_PATH: ffprobe
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - academy_data:/data
      - academy_uploads:/uploads
volumes:
  academy_data:
  academy_uploads:
